packages:
  - apps/*
  - packages/*
# 公開されたばかりの版は、乗っ取られた版だった場合に気づく間がないので、3 日待つ (Dependabot の cooldown とそろえる)。
minimumReleaseAge: 4320
# インストール時のスクリプトは動かさない。esbuild と workerd は、スクリプトなしでもビルドとテストが動く (CI の Linux でも確かめた)。
allowBuilds:
  esbuild: false
  workerd: false
# #86: 開発サーバーの CORS の脆弱版を残さない。上流が修正版を要求するようになったら外す。
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
