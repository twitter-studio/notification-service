name: Closed public production deployment

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 配置するmainの完全なcommit SHA
        required: true
        type: string
      confirmation:
        description: deploy:SHA（migrationではmigrate:SHA）
        required: true
        type: string
      maintenance_confirmed:
        description: 公開専用リソース・Queue空・作業範囲の承認を確認した
        required: true
        default: false
        type: boolean
      operation:
        description: Worker更新とD1 migrationは別々に実行する
        type: choice
        required: true
        default: deploy
        options: [deploy, migrate]
      schema_confirmed:
        description: deploy対象のmigration適用済みと旧コード互換性を確認した
        type: boolean
        default: false
      backup_confirmed:
        description: migrate前の復旧地点・復旧承認・停止範囲を記録した
        type: boolean
        default: false
      trial_until:
        description: 試験の終了時刻（UTCのYYYY-MM-DDTHH:MM:SSZ、空欄は閉鎖）
        required: false
        type: string
      trial_invite_hash:
        description: 試験用の招待コードのSHA-256（Base64URL）
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DEPLOY_OPERATION: ${{ inputs.operation }}
  DEPLOY_SHA: ${{ inputs.target_sha }}
  DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
  MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
  SCHEMA_CONFIRMED: ${{ inputs.schema_confirmed }}
  BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
  PUBLIC_PRODUCTION_DEPLOY_ENABLED: ${{ vars.PUBLIC_PRODUCTION_DEPLOY_ENABLED }}
  DEPLOY_REVIEWER: ${{ vars.DEPLOY_REVIEWER }}
  PUBLIC_TRIAL_UNTIL: ${{ inputs.trial_until }}
  PUBLIC_TRIAL_INVITE_HASH: ${{ inputs.trial_invite_hash }}

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Environment保護と同じSHAのCIを確認する
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/api/scripts/deployment-gate.mjs public-production
  operate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.operation == 'migrate' && 'production-migrations' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 配置前のdry-run（Cloudflareの資格情報なし）
        run: pnpm build
      - name: 承認した公開環境の操作と結果確認
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
          CF_QUEUE_ID: ${{ vars.CF_QUEUE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          PROD_BUNDLE_VERSION: ${{ vars.PROD_BUNDLE_VERSION }}
          VERIFICATION_DEVICE_TOKEN_KEY_CHECKS: ${{ vars.VERIFICATION_DEVICE_TOKEN_KEY_CHECKS }}
          PROD_DEVICE_TOKEN_KEY_CHECKS: ${{ vars.PROD_DEVICE_TOKEN_KEY_CHECKS }}
        run: node apps/api/scripts/deploy-sandbox.mjs public-production
